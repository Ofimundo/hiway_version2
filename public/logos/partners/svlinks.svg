    <text x="19" y="26" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="900" font-size="18" text-anchor="middle" letter-spacing="-0.5px">SV</text>
  </g>
  <!-- LINKS Wordmark in Pure White -->
  <text x="56" y="32" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="800" font-size="22" letter-spacing="3px">LINKS</text>
